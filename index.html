<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寵物日誌</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root{--primary:#5B9BD5;--primary-dark:#4A87C0;--primary-light:#EBF4FD;--accent:#FF8C5A;--danger:#E55050;--warning:#F5A623;--text-primary:#2D3748;--text-secondary:#718096;--border:#E2E8F0;--bg:#F0F4F8;--card:#FFFFFF;--shadow:0 2px 8px rgba(0,0,0,0.07);--shadow-lg:0 8px 24px rgba(0,0,0,0.12);--radius:14px;--radius-sm:8px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;}
    /* Auth */
    .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .auth-card{background:white;border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:var(--shadow-lg);}
    .auth-logo{text-align:center;font-size:48px;margin-bottom:8px;}
    .auth-title{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px;}
    .auth-sub{text-align:center;font-size:14px;color:var(--text-secondary);margin-bottom:28px;}
    .auth-tabs{display:flex;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:3px;margin-bottom:24px;gap:3px;}
    .auth-tab{flex:1;padding:8px;border:none;background:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text-secondary);transition:all 0.2s;font-family:inherit;}
    .auth-tab.active{background:var(--primary);color:white;}
    .auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--text-secondary);font-size:13px;}
    .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
    .btn-google{width:100%;padding:11px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:white;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.2s;color:var(--text-primary);font-family:inherit;}
    .btn-google:hover{background:var(--bg);border-color:var(--primary);}
    .btn-google svg{width:18px;height:18px;flex-shrink:0;}
    .auth-msg{padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;display:none;}
    .auth-msg.show{display:block;}
    .auth-msg.error{background:#FEE2E2;color:var(--danger);}
    .auth-msg.success{background:#F0FDF4;color:#16A34A;}
    .forgot-link{font-size:12px;color:var(--primary);cursor:pointer;text-align:right;margin-top:-10px;margin-bottom:14px;display:block;}
    .forgot-link:hover{text-decoration:underline;}
    .pwd-wrap{position:relative;}
    .pwd-wrap .form-control{padding-right:42px;}
    .btn-pwd-toggle{position:absolute;right:1px;top:1px;bottom:1px;width:38px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);border-radius:0 var(--radius-sm) var(--radius-sm) 0;transition:color 0.2s;}
    .btn-pwd-toggle:hover{color:var(--primary);}
    /* Header */
    .header{background:linear-gradient(135deg,#5B9BD5,#7BB3E0);color:white;padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(91,155,213,0.35);position:sticky;top:0;z-index:100;}
    .header-title{font-size:18px;font-weight:700;}
    .header-right{display:flex;align-items:center;gap:10px;}
    .btn-add-pet{background:rgba(255,255,255,0.92);color:var(--primary);border:none;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;}
    .btn-add-pet:hover{background:white;transform:translateY(-1px);}
    .btn-logout{background:rgba(255,255,255,0.2);color:white;border:1px solid rgba(255,255,255,0.4);padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;}
    .btn-logout:hover{background:rgba(255,255,255,0.3);}
    /* Tabs */
    .pet-tabs{background:white;padding:10px 16px;display:flex;gap:10px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none;}
    .pet-tabs::-webkit-scrollbar{display:none;}
    .pet-tab{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:20px;border:2px solid var(--border);background:white;cursor:pointer;white-space:nowrap;transition:all 0.2s;font-size:14px;color:var(--text-secondary);}
    .pet-tab:hover{border-color:var(--primary);color:var(--primary);}
    .pet-tab.active{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:700;}
    .pet-tab-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;overflow:hidden;flex-shrink:0;background:var(--bg);}
    .pet-tab-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    /* Main */
    .main{max-width:720px;margin:0 auto;padding:16px 16px 100px;}
    .loading-state{text-align:center;padding:64px 20px;color:var(--text-secondary);}
    .loading-state .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .empty-state{text-align:center;padding:64px 20px;color:var(--text-secondary);}
    .empty-state .icon{font-size:72px;margin-bottom:16px;}
    .empty-state h3{font-size:20px;margin-bottom:8px;color:var(--text-primary);}
    .empty-state p{font-size:14px;line-height:1.6;}
    /* Pet profile */
    .pet-profile{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;gap:16px;margin-bottom:14px;position:relative;}
    .pet-avatar{width:84px;height:84px;border-radius:50%;border:3px solid var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--primary-light);flex-shrink:0;overflow:hidden;}
    .pet-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    .pet-info{flex:1;min-width:0;}
    .pet-name{font-size:22px;font-weight:800;margin-bottom:3px;}
    .pet-sub{color:var(--text-secondary);font-size:13px;margin-bottom:8px;}
    .pet-badges{display:flex;flex-wrap:wrap;gap:6px;}
    .pet-badge{background:var(--bg);padding:4px 10px;border-radius:12px;font-size:12px;color:var(--text-secondary);border:1px solid var(--border);}
    .pet-actions{position:absolute;top:14px;right:14px;display:flex;gap:6px;}
    .btn-icon{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.2s;}
    .btn-icon:hover{background:var(--bg);}
    .btn-icon.danger:hover{background:#FEE2E2;border-color:var(--danger);}
    /* Reminder */
    .reminder-banner{background:linear-gradient(135deg,#FFFBEB,#FEF3C7);border:1.5px solid #F5C842;border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px;}
    .reminder-banner .bell{font-size:22px;flex-shrink:0;}
    .reminder-banner h4{font-size:14px;font-weight:700;color:#78540A;margin-bottom:4px;}
    .reminder-item{font-size:13px;color:#92650A;margin-top:3px;display:flex;align-items:center;gap:6px;}
    .reminder-item.overdue{color:var(--danger);font-weight:600;}
    .badge-overdue,.badge-soon{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;}
    .badge-overdue{background:#FEE2E2;color:var(--danger);}
    .badge-soon{background:#FEF3C7;color:#92650A;}
    /* Filter */
    .filter-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;padding-bottom:2px;}
    .filter-tabs::-webkit-scrollbar{display:none;}
    .filter-tab{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);background:white;cursor:pointer;font-size:13px;white-space:nowrap;transition:all 0.2s;color:var(--text-secondary);font-family:inherit;}
    .filter-tab.active{font-weight:700;}
    .filter-tab[data-type="all"].active{background:var(--text-primary);color:white;border-color:var(--text-primary);}
    .filter-tab[data-type="weight"].active{background:#EFF6FF;color:#2563EB;border-color:#2563EB;}
    .filter-tab[data-type="vaccine"].active{background:#F0FDF4;color:#16A34A;border-color:#16A34A;}
    .filter-tab[data-type="medical"].active{background:#FFF1F2;color:#E11D48;border-color:#E11D48;}
    .filter-tab[data-type="grooming"].active{background:#FAF5FF;color:#7C3AED;border-color:#7C3AED;}
    .filter-tab[data-type="other"].active{background:#FFFBEB;color:#D97706;border-color:#D97706;}
    /* Chart */
    .chart-card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px;}
    .chart-title{font-size:15px;font-weight:700;margin-bottom:14px;}
    .chart-container{position:relative;height:200px;}
    /* Events */
    .section-label{font-size:12px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;}
    .events-list{display:flex;flex-direction:column;gap:10px;}
    .event-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;transition:all 0.2s;}
    .event-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);}
    .event-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    .event-icon.weight{background:#EFF6FF;}.event-icon.vaccine{background:#F0FDF4;}.event-icon.medical{background:#FFF1F2;}.event-icon.grooming{background:#FAF5FF;}.event-icon.other{background:#FFFBEB;}
    .event-body{flex:1;min-width:0;}
    .event-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px;}
    .event-type-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
    .event-type-label.weight{color:#2563EB;}.event-type-label.vaccine{color:#16A34A;}.event-type-label.medical{color:#E11D48;}.event-type-label.grooming{color:#7C3AED;}.event-type-label.other{color:#D97706;}
    .event-date{font-size:12px;color:var(--text-secondary);flex-shrink:0;}
    .event-content{font-size:14px;color:var(--text-primary);margin-bottom:5px;line-height:1.5;}
    .event-meta{display:flex;gap:12px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap;}
    .event-cost{color:var(--accent);font-weight:700;}
    .event-due{color:var(--warning);}
    .event-due.overdue{color:var(--danger);font-weight:700;}
    .event-actions{display:flex;gap:4px;flex-shrink:0;}
    .no-data{text-align:center;padding:40px 20px;color:var(--text-secondary);font-size:14px;}
    /* FAB */
    .fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#FF8C5A,#FF6B35);color:white;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 18px rgba(255,140,90,0.45);display:flex;align-items:center;justify-content:center;transition:all 0.2s;z-index:50;}
    .fab:hover{transform:scale(1.1) rotate(90deg);}
    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity 0.22s;}
    .modal-overlay.show{opacity:1;pointer-events:all;}
    .modal{background:white;border-radius:18px;width:100%;max-width:490px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);transform:translateY(24px) scale(0.98);transition:transform 0.22s;}
    .modal-overlay.show .modal{transform:translateY(0) scale(1);}
    .modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:1;border-radius:18px 18px 0 0;}
    .modal-title{font-size:18px;font-weight:800;}
    .modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);}
    .modal-close:hover{background:var(--border);}
    .modal-body{padding:20px 24px;}
    .modal-footer{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;}
    /* Form */
    .form-group{margin-bottom:16px;}
    .form-label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
    .form-control{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;color:var(--text-primary);background:white;transition:border-color 0.2s;outline:none;font-family:inherit;}
    .form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,155,213,0.12);}
    textarea.form-control{resize:vertical;min-height:80px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
    .type-option{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:10px;border:2px solid var(--border);cursor:pointer;transition:all 0.18s;font-size:11px;text-align:center;color:var(--text-secondary);}
    .type-option:hover{border-color:var(--primary);color:var(--primary);}
    .type-option.selected{border-color:var(--primary);background:var(--primary-light);color:var(--primary);font-weight:700;}
    .type-option .em{font-size:22px;}
    .photo-upload{display:flex;align-items:center;gap:16px;}
    .photo-preview{width:80px;height:80px;border-radius:50%;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;overflow:hidden;flex-shrink:0;transition:border-color 0.2s;background:var(--bg);}
    .photo-preview:hover{border-color:var(--primary);}
    .photo-preview img{width:100%;height:100%;object-fit:cover;}
    .btn{padding:10px 20px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:inherit;}
    .btn-primary{background:var(--primary);color:white;}
    .btn-primary:hover{background:var(--primary-dark);}
    .btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
    .btn-secondary{background:var(--bg);color:var(--text-secondary);border:1px solid var(--border);}
    .btn-secondary:hover{background:var(--border);}
    .field-vaccine-due,.field-weight-val{display:none;}
    .field-vaccine-due.show,.field-weight-val.show{display:block;}
    ::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
    @media(max-width:500px){.form-row{grid-template-columns:1fr;}.type-grid{grid-template-columns:repeat(3,1fr);}.pet-profile{flex-direction:column;align-items:center;text-align:center;}.pet-badges{justify-content:center;}.pet-actions{top:12px;right:12px;}}
  </style>
</head>
<body>

<!-- 登入畫面 -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">🐾</div>
    <div class="auth-title">寵物日誌</div>
    <div class="auth-sub">登入後記錄你的毛小孩日常</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">登入</button>
      <button class="auth-tab" id="tabSignup" onclick="switchTab('signup')">註冊</button>
    </div>
    <div id="authMsg" class="auth-msg"></div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" id="authEmail" placeholder="your@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">密碼</label>
      <div class="pwd-wrap">
        <input type="password" class="form-control" id="authPassword" placeholder="至少 6 個字元">
        <button type="button" class="btn-pwd-toggle" onclick="togglePwdVisibility()" title="顯示/隱藏密碼">
          <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>
    <span class="forgot-link" id="forgotLink" onclick="handleForgotPassword()">忘記密碼？</span>
    <button class="btn btn-primary" id="authBtn" style="width:100%;margin-bottom:4px" onclick="handleEmailAuth()">登入</button>
    <div class="auth-divider">或</div>
    <button class="btn-google" onclick="handleGoogleAuth()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      使用 Google 登入
    </button>
  </div>
</div>

<!-- 主畫面 -->
<div id="appScreen" style="display:none">
  <header class="header">
    <div class="header-title">🐾 寵物日誌</div>
    <div class="header-right">
      <button class="btn-add-pet" onclick="openPetModal()">＋ 新增寵物</button>
      <button class="btn-logout" onclick="handleLogout()">登出</button>
    </div>
  </header>
  <div class="pet-tabs" id="petTabs"></div>
  <div class="main" id="mainContent"><div class="loading-state"><div class="spinner"></div><p>載入中…</p></div></div>
  <button class="fab" id="fabBtn" style="display:none" onclick="openEventModal()">＋</button>
</div>

<!-- Pet Modal -->
<div class="modal-overlay" id="petModalOverlay" onclick="handleOverlayClick(event,'petModalOverlay')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="petModalTitle">新增寵物</span>
      <button class="modal-close" onclick="closePetModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">照片</label>
        <div class="photo-upload">
          <div class="photo-preview" id="photoPreview" onclick="document.getElementById('photoInput').click()"><span id="photoPlaceholder">📷</span></div>
          <div>
            <button class="btn btn-secondary" style="font-size:13px;padding:8px 14px" onclick="document.getElementById('photoInput').click()">上傳照片</button>
            <p style="font-size:12px;color:var(--text-secondary);margin-top:6px">支援 JPG、PNG、GIF</p>
          </div>
          <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">名稱 *</label><input type="text" class="form-control" id="petName" placeholder="例：小黑"></div>
        <div class="form-group"><label class="form-label">性別</label><select class="form-control" id="petGender"><option value="">不填</option><option value="male">♂ 男生</option><option value="female">♀ 女生</option></select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">種類</label><input type="text" class="form-control" id="petSpecies" placeholder="例：狗 / 貓 / 兔"></div>
        <div class="form-group"><label class="form-label">品種</label><input type="text" class="form-control" id="petBreed" placeholder="例：柴犬"></div>
      </div>
      <div class="form-group"><label class="form-label">生日</label><input type="date" class="form-control" id="petBirthday"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closePetModal()">取消</button>
      <button class="btn btn-primary" id="savePetBtn" onclick="savePet()">儲存</button>
    </div>
  </div>
</div>

<!-- Event Modal -->

<script>
// 在 createClient 之前先讀取 hash/query（createClient 會清除它們）
const _hashParams=new URLSearchParams(window.location.hash.slice(1));
const _queryParams=new URLSearchParams(window.location.search);
const _isRecovery=_hashParams.get('type')==='recovery';
const _oauthError=_queryParams.get('error_description')||_queryParams.get('error');
// 乾淨的 redirect URL，不帶 hash/query，避免 OAuth 回調解析錯誤
const _cleanUrl=window.location.origin+window.location.pathname;

const SUPABASE_URL='https://ogwewomiemdxqhtcpzqb.supabase.co';
const SUPABASE_KEY='sb_publishable_bGK7Voz1LVAfD1J0ZY0EKA_rYSRa8pg';
let sb=null;
try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);}catch(e){console.error('Supabase 初始化失敗：',e);}

let pets=[],events=[],currentUser=null;
let currentPetId=null,filterType='all';
let editingPetId=null,editingEventId=null;
let currentPhotoUrl=null,selectedType='weight';
let weightChart=null,authMode='login';

/* ── Auth ── */
function switchTab(tab){
  authMode=tab;
  const isNewPwd=tab==='newpassword';
  document.getElementById('tabLogin').classList.toggle('active',tab==='login');
  document.getElementById('tabSignup').classList.toggle('active',tab==='signup');
  document.getElementById('authBtn').textContent={login:'登入',signup:'註冊',newpassword:'設定新密碼'}[tab]||'登入';
  document.getElementById('authBtn').onclick=handleEmailAuth;
  document.getElementById('forgotLink').style.display=tab==='login'?'block':'none';
  document.querySelector('.auth-tabs').style.display=isNewPwd?'none':'';
  clearMsg();
}

function showMsg(text,type){
  const el=document.getElementById('authMsg');
  el.textContent=text;el.className='auth-msg show '+type;
}
function clearMsg(){document.getElementById('authMsg').className='auth-msg';}
function togglePwdVisibility(){
  const input=document.getElementById('authPassword');
  const show=input.type==='password';
  input.type=show?'text':'password';
  document.getElementById('eyeIcon').style.display=show?'none':'';
  document.getElementById('eyeOffIcon').style.display=show?'':'none';
}

async function handleEmailAuth(){
  if(!sb){showMsg('服務載入失敗，請重新整理頁面','error');return;}
  if(authMode==='newpassword'){
    const pw=document.getElementById('authPassword').value;
    if(!pw||pw.length<6){showMsg('密碼至少需要 6 個字元','error');return;}
    const btn=document.getElementById('authBtn');
    btn.disabled=true;btn.textContent='更新中…';
    const{error}=await sb.auth.updateUser({password:pw});
    btn.disabled=false;btn.textContent='設定新密碼';
    if(error){showMsg(error.message,'error');return;}
    showMsg('密碼已更新！正在跳轉登入…','success');
    setTimeout(()=>switchTab('login'),2000);
    return;
  }
  const email=document.getElementById('authEmail').value.trim();
  const pw=document.getElementById('authPassword').value;
  if(!email||!pw){showMsg('請填入 Email 和密碼','error');return;}
  const btn=document.getElementById('authBtn');
  btn.disabled=true;btn.textContent='處理中…';
  if(authMode==='signup'){
    const{error}=await sb.auth.signUp({email,password:pw});
    btn.disabled=false;btn.textContent='註冊';
    if(error){showMsg(error.message,'error');return;}
    showMsg('註冊成功！請至信箱點擊驗證連結後再登入。','success');
  }else{
    const{error}=await sb.auth.signInWithPassword({email,password:pw});
    btn.disabled=false;btn.textContent='登入';
    if(error){showMsg('Email 或密碼錯誤','error');}
  }
}

async function handleGoogleAuth(){
  if(!sb){showMsg('服務載入失敗，請重新整理頁面','error');return;}
  const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:_cleanUrl}});
  if(error)showMsg(error.message,'error');
}

async function handleForgotPassword(){
  if(!sb){showMsg('服務載入失敗，請重新整理頁面','error');return;}
  const email=document.getElementById('authEmail').value.trim();
  if(!email){showMsg('請先填入你的 Email','error');return;}
  const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:_cleanUrl});
  if(error){showMsg(error.message,'error');return;}
  showMsg('重設密碼信已寄出，請檢查你的信箱！','success');
}

async function handleLogout(){
  await sb.auth.signOut();
  pets=[];events=[];currentUser=null;currentPetId=null;
  document.getElementById('appScreen').style.display='none';
  document.getElementById('authScreen').style.display='flex';
}

/* ── Data ── */
async function loadData(){
  const uid=currentUser.id;
  const[{data:pd},{data:ed}]=await Promise.all([
    sb.from('pets').select('*').eq('user_id',uid).order('created_at'),
    sb.from('events').select('*').eq('user_id',uid).order('created_at'),
  ]);
  pets=(pd||[]).map(p=>({id:p.id,name:p.name,species:p.species,breed:p.breed,birthday:p.birthday,gender:p.gender,photoUrl:p.photo_url}));
  events=(ed||[]).map(e=>({id:e.id,petId:e.pet_id,date:e.date,type:e.type,content:e.content,cost:e.cost,nextDueDate:e.next_due_date,weight:e.weight}));
}

/* ── Pet CRUD ── */
function openPetModal(petId=null){
  editingPetId=petId;currentPhotoUrl=null;
  document.getElementById('petModalTitle').textContent=petId?'編輯寵物資料':'新增寵物';
  if(petId){
    const p=pets.find(p=>p.id===petId);
    document.getElementById('petName').value=p.name;
    document.getElementById('petSpecies').value=p.species||'';
    document.getElementById('petBreed').value=p.breed||'';
    document.getElementById('petBirthday').value=p.birthday||'';
    document.getElementById('petGender').value=p.gender||'';
    currentPhotoUrl=p.photoUrl||null;
  }else{
    ['petName','petSpecies','petBreed','petBirthday'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('petGender').value='';
  }
  setPhotoPreview(currentPhotoUrl);
  document.getElementById('petModalOverlay').classList.add('show');
}
function closePetModal(){document.getElementById('petModalOverlay').classList.remove('show');}

async function savePet(){
  const name=document.getElementById('petName').value.trim();
  if(!name){alert('請輸入寵物名稱');return;}
  const btn=document.getElementById('savePetBtn');
  btn.disabled=true;btn.textContent='儲存中…';
  const payload={name,species:document.getElementById('petSpecies').value.trim()||null,breed:document.getElementById('petBreed').value.trim()||null,birthday:document.getElementById('petBirthday').value||null,gender:document.getElementById('petGender').value||null,photo_url:currentPhotoUrl||null,user_id:currentUser.id};
  if(editingPetId){
    const{error}=await sb.from('pets').update(payload).eq('id',editingPetId);
    if(error){alert('儲存失敗：'+error.message);btn.disabled=false;btn.textContent='儲存';return;}
    const i=pets.findIndex(p=>p.id===editingPetId);
    pets[i]={...pets[i],...payload,photoUrl:payload.photo_url};
  }else{
    const{data:np,error}=await sb.from('pets').insert(payload).select().single();
    if(error){alert('新增失敗：'+error.message);btn.disabled=false;btn.textContent='儲存';return;}
    pets.push({id:np.id,name:np.name,species:np.species,breed:np.breed,birthday:np.birthday,gender:np.gender,photoUrl:np.photo_url});
    currentPetId=np.id;
  }
  btn.disabled=false;btn.textContent='儲存';
  closePetModal();render();
}

async function deletePet(petId){
  if(!confirm('確定要刪除此寵物及所有記錄嗎？'))return;
  await sb.from('pets').delete().eq('id',petId);
  pets=pets.filter(p=>p.id!==petId);events=events.filter(e=>e.petId!==petId);
  if(currentPetId===petId)currentPetId=pets.length?pets[0].id:null;
  render();
}

/* ── Event CRUD ── */
function openEventModal(eventId=null){
  if(!currentPetId)return;
  editingEventId=eventId;
  document.getElementById('eventModalTitle').textContent=eventId?'編輯記錄':'新增記錄';

    const ev=events.find(e=>e.id===eventId);

    selectType(filterType!=='all'?filterType:'weight');
    document.getElementById('eventDate').value=new Date().toISOString().split('T')[0];

    document.getElementById('eventCost').value='';
    document.getElementById('eventNextDue').value='';

function closeEventModal(){document.getElementById('eventModalOverlay').classList.remove('show');}

function selectType(type){

  document.getElementById('fieldVaccineDue').classList.toggle('show',type==='vaccine');

async function saveEvent(){
  const date=document.getElementById('eventDate').value;
  if(!date){alert('請選擇日期');return;}
  const btn=document.getElementById('saveEventBtn');
  btn.disabled=true;btn.textContent='儲存中…';
  const payload={pet_id:currentPetId,date,type:selectedType,content:document.getElementById('eventContent').value.trim()||null,cost:parseFloat(document.getElementById('eventCost').value)||null,next_due_date:document.getElementById('eventNextDue').value||null,weight:parseFloat(document.getElementById('eventWeight').value)||null,user_id:currentUser.id};
  if(editingEventId){
    const{error}=await sb.from('events').update(payload).eq('id',editingEventId);
    if(error){alert('儲存失敗：'+error.message);btn.disabled=false;btn.textContent='儲存';return;}
    const i=events.findIndex(e=>e.id===editingEventId);
    events[i]={...events[i],date:payload.date,type:payload.type,content:payload.content,cost:payload.cost,nextDueDate:payload.next_due_date,weight:payload.weight};
  }else{
    const{data:ne,error}=await sb.from('events').insert(payload).select().single();
    if(error){alert('新增失敗：'+error.message);btn.disabled=false;btn.textContent='儲存';return;}
    events.push({id:ne.id,petId:ne.pet_id,date:ne.date,type:ne.type,content:ne.content,cost:ne.cost,nextDueDate:ne.next_due_date,weight:ne.weight});

  btn.disabled=false;btn.textContent='儲存';
  closeEventModal();render();

async function deleteEvent(eventId){
  if(!confirm('確定要刪除此記錄嗎？'))return;
  await sb.from('events').delete().eq('id',eventId);
  events=events.filter(e=>e.id!==eventId);render();
}

/* ── Photo ── */
function handlePhotoUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{currentPhotoUrl=ev.target.result;setPhotoPreview(currentPhotoUrl);};
  reader.readAsDataURL(file);e.target.value='';
}
function setPhotoPreview(url){
  const preview=document.getElementById('photoPreview');
  const ph=document.getElementById('photoPlaceholder');
  let img=preview.querySelector('img');
  if(url){ph.style.display='none';if(!img){img=document.createElement('img');preview.appendChild(img);}img.src=url;}
  else{ph.style.display='';if(img)img.remove();}
}

/* ── Helpers ── */
const TYPE_INFO={weight:{label:'體重',emoji:'⚖️'},vaccine:{label:'疫苗',emoji:'💉'},medical:{label:'就醫',emoji:'🏥'},grooming:{label:'美容',emoji:'✂️'},other:{label:'其他',emoji:'📝'}};
function calcAge(b){if(!b)return null;const bd=new Date(b),now=new Date();let y=now.getFullYear()-bd.getFullYear(),m=now.getMonth()-bd.getMonth();if(m<0){y--;m+=12;}if(y<1)return m===0?'不到 1 個月':`${m} 個月`;return m===0?`${y} 歲`:`${y} 歲 ${m} 個月`;}
function fmtDate(s){if(!s)return'';const d=new Date(s);return`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;}
function daysUntil(s){const t=new Date();t.setHours(0,0,0,0);return Math.ceil((new Date(s)-t)/86400000);}
function speciesEmoji(s){if(!s)return'🐾';const l=s.toLowerCase();if(l.includes('狗')||l.includes('dog'))return'🐶';if(l.includes('貓')||l.includes('cat'))return'🐱';if(l.includes('兔')||l.includes('rabbit'))return'🐰';if(l.includes('鳥')||l.includes('bird'))return'🐦';if(l.includes('魚')||l.includes('fish'))return'🐟';if(l.includes('龜')||l.includes('turtle'))return'🐢';if(l.includes('倉鼠')||l.includes('hamster'))return'🐹';return'🐾';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function handleOverlayClick(e,id){if(e.target.id===id){if(id==='petModalOverlay')closePetModal();else closeEventModal();}}
function setFilter(t){filterType=t;render();}

/* ── Render ── */
function render(){renderTabs();renderMain();document.getElementById('fabBtn').style.display=currentPetId?'flex':'none';}

function renderTabs(){
  const c=document.getElementById('petTabs');c.innerHTML='';
  pets.forEach(p=>{
    const tab=document.createElement('div');tab.className='pet-tab'+(p.id===currentPetId?' active':'');
    tab.onclick=()=>{currentPetId=p.id;filterType='all';render();};
    const av=document.createElement('div');av.className='pet-tab-avatar';
    if(p.photoUrl){const img=document.createElement('img');img.src=p.photoUrl;av.appendChild(img);}else av.textContent=speciesEmoji(p.species);
    tab.appendChild(av);tab.appendChild(document.createTextNode(p.name));c.appendChild(tab);
  });
}

function renderMain(){
  const c=document.getElementById('mainContent');
  if(!pets.length){c.innerHTML=`<div class="empty-state"><div class="icon">🐾</div><h3>還沒有寵物</h3><p>點擊右上角「新增寵物」<br>開始記錄你的毛小孩日常</p></div>`;return;}
  if(!currentPetId)currentPetId=pets[0].id;
  const pet=pets.find(p=>p.id===currentPetId);if(!pet){currentPetId=pets[0].id;return render();}
  const petEvs=events.filter(e=>e.petId===currentPetId);
  const filtered=filterType==='all'?petEvs:petEvs.filter(e=>e.type===filterType);
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date));
  const weightEvs=petEvs.filter(e=>e.type==='weight'&&e.weight!=null);
  const reminders=petEvs.filter(e=>e.type==='vaccine'&&e.nextDueDate).map(e=>({...e,days:daysUntil(e.nextDueDate)})).filter(e=>e.days<=30).sort((a,b)=>a.days-b.days);
  const gLabel={male:'♂ 男生',female:'♀ 女生'};
  let html=`<div class="pet-profile"><div class="pet-avatar">${pet.photoUrl?`<img src="${pet.photoUrl}" alt="">`:speciesEmoji(pet.species)}</div><div class="pet-info"><div class="pet-name">${esc(pet.name)}</div><div class="pet-sub">${esc(pet.species||'')}${pet.breed?` · ${esc(pet.breed)}`:''}</div><div class="pet-badges">${pet.birthday?`<span class="pet-badge">🎂 ${calcAge(pet.birthday)}</span>`:''} ${pet.gender?`<span class="pet-badge">${gLabel[pet.gender]}</span>`:''} ${pet.birthday?`<span class="pet-badge">📅 ${fmtDate(pet.birthday)}</span>`:''}<span class="pet-badge">📋 ${petEvs.length} 筆記錄</span></div></div><div class="pet-actions"><button class="btn-icon" onclick="openPetModal('${pet.id}')">✏️</button><button class="btn-icon danger" onclick="deletePet('${pet.id}')">🗑️</button></div></div>`;
  if(reminders.length){html+=`<div class="reminder-banner"><span class="bell">🔔</span><div><h4>疫苗到期提醒</h4>`;reminders.forEach(r=>{const ov=r.days<0;const badge=ov?`<span class="badge-overdue">逾期 ${Math.abs(r.days)} 天</span>`:r.days===0?`<span class="badge-overdue">今天到期</span>`:`<span class="badge-soon">${r.days} 天後</span>`;html+=`<div class="reminder-item ${ov?'overdue':''}">${badge} ${esc(r.content||'疫苗')} — ${fmtDate(r.nextDueDate)}</div>`;});html+=`</div></div>`;}
  const counts={all:petEvs.length};Object.keys(TYPE_INFO).forEach(t=>counts[t]=petEvs.filter(e=>e.type===t).length);
  html+=`<div class="filter-tabs">`;
  [['all','全部'],['weight','⚖️ 體重'],['vaccine','💉 疫苗'],['medical','🏥 就醫'],['grooming','✂️ 美容'],['other','📝 其他']].forEach(([t,label])=>{if(counts[t]===0&&t!=='all')return;html+=`<button class="filter-tab ${filterType===t?'active':''}" data-type="${t}" onclick="setFilter('${t}')">${label}${counts[t]>0?` <span style="opacity:.65">${counts[t]}</span>`:''}</button>`;});
  html+=`</div>`;
  if((filterType==='all'||filterType==='weight')&&weightEvs.length>=1)html+=`<div class="chart-card"><div class="chart-title">⚖️ 體重趨勢</div><div class="chart-container"><canvas id="weightCanvas"></canvas></div></div>`;
  if(!sorted.length){html+=`<div class="no-data">${filterType==='all'?'還沒有記錄，點擊右下角 ＋ 新增第一筆！':`沒有「${TYPE_INFO[filterType]?.label}」記錄`}</div>`;}
  else{html+=`<div class="section-label">${filterType==='all'?'全部記錄':TYPE_INFO[filterType]?.label} · ${sorted.length} 筆</div><div class="events-list">`;sorted.forEach(ev=>{const info=TYPE_INFO[ev.type]||TYPE_INFO.other;const dueLabel=ev.nextDueDate?(()=>{const d=daysUntil(ev.nextDueDate),ov=d<0;return`<span class="event-due ${ov?'overdue':''}">⏰ 下次 ${fmtDate(ev.nextDueDate)}${ov?` (逾期 ${Math.abs(d)} 天)`:d===0?' (今天)':`(${d} 天後)`}</span>`;})():'';const costLabel=ev.cost?`<span class="event-cost">💰 NT$ ${ev.cost.toLocaleString()}</span>`:'';html+=`<div class="event-card"><div class="event-icon ${ev.type}">${info.emoji}</div><div class="event-body"><div class="event-header"><span class="event-type-label ${ev.type}">${info.label}${ev.weight?` · ${ev.weight} kg`:''}</span><span class="event-date">${fmtDate(ev.date)}</span></div>${ev.content?`<div class="event-content">${esc(ev.content)}</div>`:''}<div class="event-meta">${costLabel}${dueLabel}</div></div><div class="event-actions"><button class="btn-icon" onclick="openEventModal('${ev.id}')">✏️</button><button class="btn-icon danger" onclick="deleteEvent('${ev.id}')">🗑️</button></div></div>`;});html+=`</div>`;}
  c.innerHTML=html;
  if((filterType==='all'||filterType==='weight')&&weightEvs.length>=1)renderWeightChart(weightEvs);
}

function renderWeightChart(wEvs){
  const s=[...wEvs].sort((a,b)=>a.date.localeCompare(b.date));
  const data=s.map(e=>e.weight),min=Math.min(...data),max=Math.max(...data),pad=(max-min)*0.3||0.5;
  if(weightChart){weightChart.destroy();weightChart=null;}
  const ctx=document.getElementById('weightCanvas');if(!ctx)return;
  weightChart=new Chart(ctx,{type:'line',data:{labels:s.map(e=>fmtDate(e.date)),datasets:[{label:'體重 (kg)',data,borderColor:'#5B9BD5',backgroundColor:'rgba(91,155,213,0.1)',borderWidth:2.5,pointBackgroundColor:'#5B9BD5',pointBorderColor:'#fff',pointBorderWidth:2,pointRadius:5,pointHoverRadius:7,fill:true,tension:0.35}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.parsed.y} kg`}}},scales:{x:{grid:{display:false},ticks:{font:{size:11},maxTicksLimit:7}},y:{min:Math.max(0,min-pad),max:max+pad,grid:{color:'rgba(0,0,0,0.05)'},ticks:{callback:v=>v.toFixed(1)+' kg',font:{size:11},maxTicksLimit:5}}}}});
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePetModal();closeEventModal();}});

/* ── 初始化 ── */
if(!sb){
  const msg=document.getElementById('authMsg');
  msg.className='auth-msg show error';
  msg.textContent='服務載入失敗，請重新整理頁面或檢查網路連線';

// 從 URL hash 直接偵測 recovery（最可靠，不依賴事件時序）
if(_isRecovery){
  switchTab('newpassword');
  showMsg('請設定你的新密碼（至少 6 個字元）','success');
}
// OAuth 回來有錯誤時顯示給用戶
if(_oauthError){
  showMsg('Google 登入失敗：'+decodeURIComponent(_oauthError),'error');
  history.replaceState(null,'',_cleanUrl);
}

sb?.auth.onAuthStateChange(async(event,session)=>{
  if(event==='PASSWORD_RECOVERY'){
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('appScreen').style.display='none';
    switchTab('newpassword');
    showMsg('請設定你的新密碼（至少 6 個字元）','success');
    return;
  }
  // recovery 模式下不因 SIGNED_IN 跳進主畫面
  if(authMode==='newpassword')return;
  if(session?.user){
    currentUser=session.user;
    document.getElementById('authScreen').style.display='none';
    document.getElementById('appScreen').style.display='block';
    await loadData();
    if(pets.length)currentPetId=pets[0].id;
    render();
  }else{
    currentUser=null;
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('appScreen').style.display='none';
  }
});
</script>
</body>
</html>
